packages:
  - apps/*
  - packages/*

# Keep each app's dependency boundaries explicit.
nodeLinker: isolated
overrides:
  undici: ^6.29.0
  '@fastify/busboy': ^3.2.2
  # Preserve the PDF family that was verified before the workspace migration.
  # A newer layout pulls textkit 7, whose import-only hyphenation exports break tsx.
  '@react-pdf/fns': 3.1.3
  '@react-pdf/font': 4.0.8
  '@react-pdf/image': 3.1.0
  '@react-pdf/layout': 4.6.1
  '@react-pdf/pdfkit': 5.1.1
  '@react-pdf/primitives': 4.3.0
  '@react-pdf/reconciler': 2.0.0
  '@react-pdf/render': 4.5.1
  '@react-pdf/stylesheet': 6.2.1
  '@react-pdf/svg': 1.1.0
  '@react-pdf/textkit': 6.3.0
  '@react-pdf/types': 2.11.1
allowBuilds:
  sharp: true
  esbuild: true
  '@nestjs/core': false
  protobufjs: false
minimumReleaseAgeExclude:
  - express@5.3.0
